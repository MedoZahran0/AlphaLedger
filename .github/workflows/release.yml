name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Validate release tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\src\AlphaLedger.App\AlphaLedger.App.csproj
          $version = $project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1 -ExpandProperty Version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME must match project version v$version."
          }

      - name: Build standalone installer
        shell: pwsh
        run: .\installer\build-installer.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create $env:GITHUB_REF_NAME .\Release\AlphaLedger-Setup.exe --title "AlphaLedger $env:GITHUB_REF_NAME" --generate-notes
