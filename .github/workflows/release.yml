name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Validate release tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\src\AlphaLedger.App\AlphaLedger.App.csproj
          $version = $project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1 -ExpandProperty Version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME must match project version v$version."
          }

      - name: Build standalone installer
        shell: pwsh
        run: .\installer\build-installer.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            '.\Release\AlphaLedger-Setup.exe',
            '.\Release\AlphaLedger-Update.exe'
          )
          gh release create $env:GITHUB_REF_NAME @assets --title "AlphaLedger $env:GITHUB_REF_NAME" --notes-file ".\updates\$($env:GITHUB_REF_NAME).md"

      - name: Publish update manifest after release assets are available
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\src\AlphaLedger.App\AlphaLedger.App.csproj
          $version = $project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1 -ExpandProperty Version
          $hash = (Get-FileHash .\Release\AlphaLedger-Update.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $version
            sha256 = "sha256:$hash"
          } | ConvertTo-Json

          git fetch origin main
          git checkout -B publish-update-manifest origin/main
          Set-Content -Path .\updates\latest.json -Value $manifest -Encoding utf8NoBOM
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          git commit -m "Publish update manifest for v$version"
          git push origin HEAD:main
